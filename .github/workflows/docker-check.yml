# 验证 Docker 镜像真的能构建、ffmpeg 真的在、服务真的能起来。
#
# 为什么要有它
# ------------
# 开发机没装 Docker（WSL 里也只有 stub），所以 Dockerfile 的错在本地**根本测不出来**：
#   要么等 Render 上构建失败（3~6 分钟，而且只有云端日志），
#   要么等部署后访问 502 才发现。
# 这个工作流把「构建 → ffmpeg 可用 → 服务启动 → 首页 200」整条链路在 CI 里跑一遍，
# 把问题挡在推送之后、部署之前。
#
# 也和 Render 形成双保险：CI 通过 ≠ Render 一定通过（环境略有差异），
# 但 CI 失败就一定别去点部署。

name: 验证 Docker 镜像

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "*.py"
      - "static/**"
      - ".github/workflows/docker-check.yml"
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t multipldl:ci .

      - name: 确认镜像里 ffmpeg 可用（B站 出成片的前提）
        run: |
          docker run --rm multipldl:ci ffmpeg -version | head -1

      - name: 启动服务并探活
        run: |
          set -e
          docker run -d --name smoke -e PORT=10000 -p 10000:10000 multipldl:ci
          # 等它起来（uvicorn + 依赖 import 需要几秒）
          for i in $(seq 1 30); do
            if curl -fsS -o /tmp/idx.html http://127.0.0.1:10000/; then
              echo "首页在第 $i 次探测时返回 200"
              break
            fi
            sleep 1
          done
          echo "--- 容器日志 ---"
          docker logs smoke
          echo "--- 首页校验 ---"
          test -s /tmp/idx.html || { echo "首页为空，失败"; exit 1; }
          grep -q "__SERVICE_PORT__" /tmp/idx.html && { echo "端口占位符没被替换，失败"; exit 1; }
          grep -q "10000" /tmp/idx.html || { echo "注入的端口不对，失败"; exit 1; }
          echo "首页 $(wc -c < /tmp/idx.html) 字节，占位符已替换为 10000"

      - name: 确认 B站 合流能力上报正常
        run: |
          set -e
          curl -fsS http://127.0.0.1:10000/api/bili/mux/capability > /tmp/cap.json
          cat /tmp/cap.json
          echo
          # 容器里没有安卓的 MediaMuxer，这个接口应当如实报告「不可用」而不是报错
          grep -q '"available"' /tmp/cap.json || { echo "接口返回异常，失败"; exit 1; }

      - name: 探测 TikTok 可达性（境外出口参考）
        # 这一条**不阻塞**构建：只用来回答「境外机房到底能不能直连 TikTok」。
        # 注意 GitHub runner 与 Render 不是同一家机房（前者 Azure，后者 AWS），
        # 结论只能当参考，不能当保证 —— 真结果以 Render 部署后的实测为准。
        #
        # 探三个地址，因为解析链路依赖**两个不同主机**：
        #   www.tiktok.com  —— 拿视频页数据（首页 200 不代表视频页能拿）
        #   vm./vt.tiktok.com —— 短链跳转，是「粘贴分享链接」这条主路径的第一步
        # 少探一个，就可能出现「首页通、真下载挂」的假绿灯。
        continue-on-error: true
        run: |
          echo "--- 从容器里探 TikTok（模拟境外出口）---"
          docker run --rm multipldl:ci python -c "
          import requests
          ua = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
          urls = [
              'https://www.tiktok.com/',
              'https://www.tiktok.com/player/api/v1/items?aid=1988',
              'https://vm.tiktok.com/ZM6nQqQqQ/',
          ]
          ok = 0
          for url in urls:
              try:
                  r = requests.get(url, timeout=15, headers=ua, allow_redirects=True)
                  print('%-52s -> HTTP %s  %d bytes' % (url, r.status_code, len(r.content)))
                  if r.status_code < 500:
                      ok += 1
              except Exception as exc:
                  print('%-52s -> %s: %s' % (url, type(exc).__name__, str(exc)[:80]))
          print()
          print('小结：%d/%d 个地址可达。4xx 也算可达（说明 TCP+TLS 通了，是业务层拒绝）；' % (ok, len(urls)))
          print('      0 个可达才说明这个机房连不上 TikTok。')
          "

      - name: 探测抖音高清通道（境外出口是否被风控）
        # 同样**不阻塞**构建。抖音的「多档清晰度」依赖 /aweme/v1/web/aweme/detail/
        # （带 a_bogus 签名 + 非登录态 ttwid）。这个接口对大机房 / 境外 IP 的风控更严，
        # 一旦返回空响应体，服务就会降级到 share 页方案 —— 界面显示「降级通道 · 仅默认档」。
        #
        # 这条探测把「境外能不能用高清通道」变成一条可查的证据，而不是靠猜。
        # 注意：GitHub runner 在 Azure、Render 在 AWS，机房不同，结论仍只能当参考。
        continue-on-error: true
        run: |
          echo "--- 从容器里探抖音高清通道 ---"
          docker run --rm multipldl:ci python -c "
          import douyin_hd
          client = douyin_hd.HDClient()
          try:
              detail = client.fetch_detail('6918273131559881997')
              video = detail.get('video') or {}
              gears = video.get('bit_rate') or []
              print('高清通道可用：bit_rate 档数 = %d，作品 ratio = %s' % (len(gears), video.get('ratio')))
              for g in gears:
                  print('   %-40s %s' % (g.get('gear_name'), g.get('bit_rate')))
              print()
              print('小结：档数 > 0 就说明境外出口没被风控；为 0 或抛异常则部署后会降级。')
          except Exception as exc:
              print('高清通道不可用（部署后将降级为「仅默认档」）：%s: %s' % (type(exc).__name__, exc))
          "

      - name: 清理
        if: always()
        run: docker rm -f smoke || true
